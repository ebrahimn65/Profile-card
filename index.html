<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Profile card component</title>

  <link rel="stylesheet" href="style/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>

  <main class="profile-container">
    <article class="profile-card">
      <div class="profile-card__header">
        <img class="profile-card__img" src="images/image-victor.jpg" alt="Victor Crest">
      </div>
      <div class="profile-card__content">
        <div class="profile-card__name-wrapper">
          <h1 class="profile-card__name">Victor Crest</h1>
          <span class="profile-card__age">26</span>
        </div>
        <p class="profile-card__city">London</p>
        <div class="profile-card__stats">
          <div class="profile-card__stats-item">
            <p class="profile-card__stat-number">80K</p>
            <p class="profile-card-stat-desc">Followers</p>
          </div>
          <div class="profile-card__stats-item">
            <p class="profile-card__stat-number">803K</p>
            <p class="profile-card-stat-desc">Likes</p>

          </div>
          <div class="profile-card__stats-item">
            <p class="profile-card__stat-number">1.4K</p>
            <p class="profile-card-stat-desc">Photos</p>

          </div>
        </div>
      </div>
    </article>
  </main>


</body>

</html>
